syntax = "proto3";

option go_package = "github.com/Kirragami/panoptes/proto";

package panoptes;

service PanoptesService {
    rpc BindEye(BindRequest) returns (BindResponse);
    rpc KeepVigil(stream EyePulse) returns (stream PanopticonSignal);
}

message BindRequest {
    string eye_id = 1;
    string seal = 2;
    string brand = 3;
}

message BindResponse {
    bool success = 1;
    string status_message = 2;
    string brand = 3;
}

message EyePulse {
    string eye_id = 1;
    int64 sent_at_unix = 2;
    string brand = 3;
}

message PanopticonSignal {
    string message = 1;
}