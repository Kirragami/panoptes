syntax = "proto3";

option go_package = "github.com/Kirragami/panoptes/proto";

package panoptes;

import "google/protobuf/struct.proto";

message Vision {
    string vision = 1;
    uint32 form = 2;
    bool awake = 3;
    string slumber_reason = 4;
}

message Gaze {
    string sigil = 1;
    uint64 turn = 2;
    bool awake = 3;

    string vision = 4;
    uint32 form = 5;
    google.protobuf.Struct focus = 6;
}